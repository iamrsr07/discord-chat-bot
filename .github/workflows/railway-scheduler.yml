name: Railway Auto Start/Stop Bot

on:
  schedule:
    # 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
    # 5:00 PM EST (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger
jobs:
  railway:
    runs-on: ubuntu-latest
    steps:
      - name: Start or stop Railway bot
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Detect current UTC hour (integer)
          HOUR=$(date -u +'%H')

          # 14 = 9 AM EST, 22 = 5 PM EST
          if [ "$HOUR" -eq "14" ]; then
            echo "Starting bot (9 AM EST)..."
            railway up --service "your-service-name" --yes
          elif [ "$HOUR" -eq "22" ]; then
            echo "Stopping bot (5 PM EST)..."
            railway remove --service "your-service-name" --yes
          else
            echo "No action right now."
          fi
